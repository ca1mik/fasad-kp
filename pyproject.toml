[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "kp-fasad-outreach"
version = "0.1.0"
description = "CLI for safe outreach campaigns backed by Google Sheets and SQLite"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "google-auth>=2.38,<3",
  "google-auth-oauthlib>=1.2,<2",
  "python-dotenv>=1.0.1,<2",
  "requests>=2.32.3,<3",
  "tzdata>=2025.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9", "playwright>=1.55,<2", "ezdxf>=1.3,<2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
